<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500&family=Tiro+Telugu:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #f3f2ee;
        color: #43423d;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
        position: relative;
        overflow: hidden;
      }
      .rule {
        position: absolute;
        left: 72px;
        top: 72px;
        width: 64px;
        height: 3px;
        background: #1f4d7a;
      }
      .wrap {
        position: absolute;
        left: 72px;
        top: 168px;
        width: 760px;
      }
      h1 {
        font-family: "Tiro Telugu", Georgia, serif;
        font-weight: 400;
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.015em;
        color: #191917;
      }
      .role {
        margin-top: 24px;
        font-size: 24px;
        color: #43423d;
      }
      .stack {
        margin-top: 18px;
        font-size: 18px;
        color: #4d4c47;
      }
      .mark {
        position: absolute;
        right: 72px;
        top: 168px;
        width: 176px;
        height: 176px;
        border-radius: 10px;
        background: #191917;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark span {
        font-family: "Tiro Telugu", Georgia, serif;
        font-size: 56px;
        color: #f3f2ee;
        line-height: 1;
      }
      .mark i {
        position: absolute;
        bottom: 34px;
        width: 56px;
        height: 4px;
        border-radius: 4px;
        background: #1f4d7a;
      }
      .foot {
        position: absolute;
        left: 72px;
        bottom: 68px;
        font-size: 18px;
        color: #4d4c47;
        border-top: 1px solid #dedcd4;
        padding-top: 18px;
        width: 1056px;
      }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <div class="wrap">
      <h1>Durgajanesh&nbsp;Devadula</h1>
      <p class="role">Web developer &middot; B.Tech AI &amp; ML student</p>
      <p class="stack">C# &middot; .NET &middot; HTML &middot; CSS &middot; JavaScript &middot; Bootstrap &middot; SQL</p>
    </div>
    <div class="mark"><span>D</span><i></i></div>
    <div class="foot">Visakhapatnam, India &mdash; open to freelance and project-based work</div>
  </body>
</html>
